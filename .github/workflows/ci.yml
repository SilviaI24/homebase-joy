name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit de dependencias (falla solo en alta/crítica)
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      # Bloqueante desde el 23 ago 2026: limpiados los 86
      # @typescript-eslint/no-explicit-any y los 9 react-hooks/exhaustive-deps
      # (ver commits de esa fecha). Quedan solo 9 avisos
      # react-refresh/only-export-components (patrón estándar de shadcn/ui,
      # no un bug) — los avisos no hacen fallar `eslint` por defecto.
      - name: Lint
        run: npx eslint src tests

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
